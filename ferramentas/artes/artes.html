<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"Caveat";font-weight:700;src:url("../../node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2") format("woff2")}
  @font-face{font-family:"Special Elite";font-weight:400;src:url("../../node_modules/@fontsource/special-elite/files/special-elite-latin-400-normal.woff2") format("woff2")}
  @font-face{font-family:"Anton";font-weight:400;src:url("../../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2") format("woff2")}
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
  #palco{position:absolute;inset:0}
  .el{position:absolute;white-space:nowrap}
  .titulo{font-family:"Inter Display","Inter",sans-serif;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.5px;
          text-shadow:0 4px 24px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.9)}
  .chave{font-family:"Inter",sans-serif;font-weight:700;color:#fff;font-size:64px;
         text-shadow:0 3px 16px rgba(0,0,0,.85),0 0 3px #000}
  .chave b{color:#ff2b2b}
  .mao{font-family:"Caveat",cursive;font-weight:700;color:#fff;font-size:104px;
       text-shadow:0 3px 14px rgba(0,0,0,.85)}
  .maq{font-family:"Special Elite","Courier 10 Pitch",monospace;font-weight:400;color:#f4efe2;font-size:50px;
       background:rgba(0,0,0,.55);padding:10px 22px;letter-spacing:1px}
  .carimbo{font-family:"Anton","Inter Display",sans-serif;font-weight:400;color:#e0141e;font-size:120px;letter-spacing:4px;
           border:12px solid #e0141e;padding:4px 30px;border-radius:14px;mix-blend-mode:normal;
           text-shadow:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
  .perigo{font-family:"Inter Display",sans-serif;font-weight:900;color:#ff1a1a;font-size:190px;letter-spacing:2px;
          text-shadow:0 0 30px rgba(255,0,0,.55),0 6px 30px rgba(0,0,0,.8)}
</style></head>
<body><div id="palco"></div>
<script>
// Artes do canal. Cada arte = {tipo, ...}. window.quadro(arte, t, dur) desenha o estado no tempo t (s).
const palco = document.getElementById('palco');
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
const back = x => { x=Math.min(Math.max(x,0),1); const c=1.70158; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
function saida(t, dur, d=0.18){ return Math.min(1, Math.max(0, (dur - t) / d)); }
function rnd(seed){ let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function setaMao(x1,y1,x2,y2,prog,cor='#fff',seed=7){
  // seta "desenhada a mao": curva com leve tremido, desenhada progressivamente
  const r = rnd(seed), mx=(x1+x2)/2+(y2-y1)*0.18, my=(y1+y2)/2-(x2-x1)*0.18;
  const pts=[]; for(let i=0;i<=40;i++){const u=i/40;const x=(1-u)*(1-u)*x1+2*(1-u)*u*mx+u*u*x2;const y=(1-u)*(1-u)*y1+2*(1-u)*u*my+u*u*y2;pts.push([x+(r()-.5)*2.2,y+(r()-.5)*2.2]);}
  const n = Math.max(1, Math.floor(pts.length*prog));
  const d = pts.slice(0,n).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  let ponta='';
  if (prog>=0.98){ const [ax,ay]=pts[pts.length-1],[bx,by]=pts[pts.length-6]; const ang=Math.atan2(ay-by,ax-bx);
    const L=34, a1=ang+2.6, a2=ang-2.6;
    ponta=`M${ax+L*Math.cos(a1)} ${ay+L*Math.sin(a1)} L${ax} ${ay} L${ax+L*Math.cos(a2)} ${ay+L*Math.sin(a2)}`; }
  return `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7))">
    <path d="${d}" stroke="${cor}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${ponta}" stroke="${cor}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

window.quadro = function(a, t, dur){
  let h = '';
  const out = saida(t, dur);
  if (a.tipo === 'etiqueta'){            // nome escrito + seta apontando
    const pT = ease(t/0.25), pS = ease((t-0.12)/0.35);
    h += `<div class="el mao" style="left:${a.x}px;top:${a.y}px;opacity:${pT*out};transform:translateY(${(1-pT)*20}px) rotate(${a.rot||-3}deg)">${a.texto}</div>`;
    h += `<div style="position:absolute;inset:0;opacity:${out}">${setaMao(a.sx,a.sy,a.ax,a.ay,pS,a.cor||'#fff',a.seed||7)}</div>`;
  } else if (a.tipo === 'chave'){        // frase-chave na parte de baixo
    const p = ease(t/0.22);
    h += `<div class="el chave" style="left:50%;top:${a.y||900}px;transform:translate(-50%,${(1-p)*24}px);opacity:${p*out}">${a.texto}</div>`;
  } else if (a.tipo === 'perigo'){       // palavra vermelha tremendo (ameaca)
    const p = back(t/0.22), r = rnd(Math.floor(t*30)+3);
    const dx=(r()-.5)*14, dy=(r()-.5)*14, s=0.6+0.4*p;
    h += `<div class="el perigo" style="left:${a.x?a.x+'px':'50%'};top:${a.y||430}px;transform:translate(calc(-50% + ${dx}px),${dy}px) scale(${s});opacity:${Math.min(1,t/0.06)*out}">${a.texto}</div>`;
  } else if (a.tipo === 'carimbo'){      // carimbo batendo
    const p = ease(t/0.16), s = 2.2 - 1.2*p;
    h += `<div class="el carimbo" style="left:${a.x}px;top:${a.y}px;transform:translate(-50%,-50%) rotate(${a.rot||-8}deg) scale(${s});opacity:${Math.min(1,t/0.08)*out}">${a.texto}</div>`;
  } else if (a.tipo === 'maquina'){      // texto datilografado (lugar/ano)
    const n = Math.floor(Math.max(0,t-0.05)/ (a.vel||0.045));
    const txt = a.texto.slice(0, n), cursor = (Math.floor(t*3)%2===0 && n<a.texto.length+6) ? '▌' : '&nbsp;';
    h += `<div class="el maq" style="left:${a.x}px;top:${a.y}px;opacity:${out}">${txt}${cursor}</div>`;
  } else if (a.tipo === 'contador'){     // numero contando + rotulo
    const p = ease(t/(a.tc||0.7)); const v = Math.round(a.de + (a.ate-a.de)*p);
    const s = 1 + 0.12*Math.max(0, 1 - Math.abs(t - (a.tc||0.7))/0.12);
    h += `<div class="el titulo" style="left:${a.x}px;top:${a.y}px;font-size:${a.tam||150}px;transform:translate(-50%,-50%) scale(${s});opacity:${Math.min(1,t/0.1)*out}">${v}<span style="font-size:.42em;margin-left:18px">${a.rotulo||''}</span></div>`;
  } else if (a.tipo === 'canto'){        // marcador pequeno no canto (ex.: temporada)
    const p = ease(t/0.2);
    h += `<div class="el titulo" style="left:${a.x||70}px;top:${a.y||70}px;font-size:${a.tam||44}px;opacity:${p*out};transform:translateX(${(1-p)*-30}px);
          background:#e0141e;padding:6px 18px;text-shadow:none">${a.texto}</div>`;
  } else if (a.tipo === 'inscrever'){   // botao "Inscrever-se" com cursor clicando
    const p = back(t/0.3), clk = t > 0.9, fim = saida(t, dur, 0.25);
    const cx = 1500 + (1 - ease((t-0.3)/0.55)) * 260, cy = 900 + (1 - ease((t-0.3)/0.55)) * 140 - (clk && t < 1.05 ? 4 : 0);
    h += `<div class="el" style="left:${a.x||1180}px;top:${a.y||820}px;transform:scale(${0.6+0.4*p}) ${clk&&t<1.05?'scale(.94)':''};opacity:${Math.min(1,t/0.12)*fim};
          display:flex;align-items:center;gap:22px;background:rgba(15,15,15,.92);padding:18px 26px 18px 18px;border-radius:60px;box-shadow:0 8px 30px rgba(0,0,0,.6)">
          <div style="width:74px;height:74px;border-radius:50%;background:#e0141e;display:flex;align-items:center;justify-content:center;font:900 34px Inter;color:#fff">LT</div>
          <div style="font:800 38px Inter;color:#fff">${a.canal||'Luiz Telico'}</div>
          <div style="font:800 32px Inter;color:#fff;background:${clk?'#3a3a3a':'#e0141e'};padding:14px 30px;border-radius:40px">${clk?'Inscrito ✓':'Inscrever-se'}</div></div>`;
    h += `<svg width="60" height="70" style="position:absolute;left:${cx}px;top:${cy}px;opacity:${Math.min(1,(t-0.25)/0.1)*fim};filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))">
          <path d="M5 3 L5 55 L18 43 L28 66 L37 62 L27 40 L45 40 Z" fill="#fff" stroke="#000" stroke-width="3"/></svg>`;
  } else if (a.tipo === 'carta'){       // carta escrita a mao sobre papel, linhas aparecendo
    const p = ease(t/0.35), out2 = saida(t, dur, 0.3);
    const linhas = a.linhas || [];
    let txt = '', tot = 0, vis = Math.max(0, (t - 0.35) / (a.vel || 0.045));
    for (const l of linhas){ const n = Math.max(0, Math.min(l.length, Math.floor(vis - tot))); txt += `<div style="min-height:70px">${l.slice(0,n)}</div>`; tot += l.length + 6; }
    h += `<div class="el" style="left:50%;top:50%;width:1100px;height:760px;transform:translate(-50%,calc(-50% + ${(1-p)*80}px)) rotate(-2.5deg);opacity:${p*out2};
          background:linear-gradient(#f3ead6,#e9dcbc);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.7);padding:70px 90px;box-sizing:border-box;white-space:normal;
          font-family:Caveat,cursive;font-weight:700;font-size:66px;color:#2b2a3a;line-height:1.05;
          background-image:repeating-linear-gradient(transparent,transparent 69px,rgba(80,110,160,.35) 70px),linear-gradient(#f3ead6,#e9dcbc)">${txt}</div>`;
  } else if (a.tipo === 'meme'){        // punchline grande (Anton, branco com contorno preto), entra com pulo
    const p = back(t/0.18), s = 0.7 + 0.3*p;
    h += `<div class="el" style="left:50%;top:${a.y||120}px;transform:translateX(-50%) scale(${s}) rotate(${a.rot||-2}deg);opacity:${Math.min(1,t/0.06)*out};
          font-family:Anton,'Inter Display',sans-serif;font-size:${a.tam||110}px;color:${a.cor||'#fff'};letter-spacing:1px;text-transform:uppercase;
          -webkit-text-stroke:8px #000;paint-order:stroke fill;text-shadow:0 8px 24px rgba(0,0,0,.6)">${a.texto}</div>`;
  } else if (a.tipo === 'dialogo'){     // conversa em baloes (ex.: mae x filho), um balao por vez
    const falas = a.falas || []; let y = a.y || 140;
    falas.forEach((f, i) => {
      const t0 = f.t || i*0.9; if (t < t0) return;
      const p = back((t - t0)/0.25), esq = f.lado !== 'dir';
      h += `<div class="el" style="${esq?'left':'right'}:${a.margem||110}px;top:${y}px;opacity:${Math.min(1,(t-t0)/0.08)*out};transform:scale(${0.6+0.4*p});transform-origin:${esq?'left':'right'} top;
            max-width:900px;white-space:normal;background:${esq?'#fff':'#ffd400'};color:#111;border-radius:34px;padding:22px 34px;
            font:800 46px Inter,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.55)">
            <div style="font:900 28px Inter,sans-serif;color:${esq?'#e0141e':'#7a4b00'};margin-bottom:6px">${f.quem}</div>${f.texto}</div>`;
      y += f.alto || 190;
    });
  } else if (a.tipo === 'lista'){       // itens aparecendo com marca (✓ verde / ✗ vermelho)
    const itens = a.itens || []; const p = ease(t/0.25);
    let li = itens.map((it, i) => { const t0 = 0.25 + i*(a.vel||0.45); if (t < t0) return '';
      const q = back((t-t0)/0.2), ok = it.ok !== false;
      return `<div style="display:flex;align-items:center;gap:26px;margin:14px 0;transform:translateX(${(1-q)*-60}px);opacity:${Math.min(1,(t-t0)/0.08)}">
        <div style="width:72px;height:72px;border-radius:14px;background:${ok?'#16b45a':'#e0141e'};color:#fff;font:900 54px Inter;display:flex;align-items:center;justify-content:center">${ok?'✓':'✗'}</div>
        <div style="font:900 58px Inter,sans-serif;color:#fff;text-shadow:0 4px 14px #000;white-space:normal;max-width:${a.larg||700}px;line-height:1.05">${it.texto}</div></div>`; }).join('');
    h += `<div class="el" style="left:${a.x||120}px;top:${a.y||180}px;opacity:${p*out};background:rgba(0,0,0,.62);padding:30px 44px;border-radius:24px">
          ${a.titulo?`<div style="font:900 40px Inter;color:#ffd400;margin-bottom:8px;text-transform:uppercase">${a.titulo}</div>`:''}${li}</div>`;
  } else if (a.tipo === 'versus'){      // dois lados batendo no centro: A  VS  B
    const p = back(t/0.3), v = back((t-0.25)/0.25);
    h += `<div class="el titulo" style="left:${960-(1-p)*600}px;top:${a.y||430}px;transform:translateX(-110%);font-size:${a.tam||120}px;color:${a.cor1||'#16b45a'};opacity:${Math.min(1,t/0.1)*out}">${a.a}</div>`;
    h += `<div class="el titulo" style="left:${960+(1-p)*600}px;top:${a.y||430}px;transform:translateX(10%);font-size:${a.tam||120}px;color:${a.cor2||'#e0141e'};opacity:${Math.min(1,t/0.1)*out}">${a.b}</div>`;
    h += `<div class="el" style="left:960px;top:${(a.y||430)+10}px;transform:translateX(-50%) scale(${Math.max(0,v)});opacity:${out};
          font-family:Anton,sans-serif;font-size:110px;color:#ffd400;-webkit-text-stroke:6px #000;paint-order:stroke fill">VS</div>`;
  } else if (a.tipo === 'cardfilme'){   // card de filme: titulo grande, ano e diretor, faixa colorida
    const p = ease(t/0.3);
    h += `<div class="el" style="left:${a.x||110}px;top:${a.y||720}px;transform:translateX(${(1-p)*-80}px);opacity:${p*out};
          border-left:14px solid ${a.cor||'#e0141e'};background:rgba(8,8,10,.78);padding:18px 40px 22px 32px;border-radius:0 18px 18px 0">
          <div style="font-family:Anton,sans-serif;font-size:${a.tam||96}px;color:#fff;letter-spacing:2px;text-transform:uppercase">${a.titulo}</div>
          <div style="font:700 34px Inter,sans-serif;color:#cfcfcf">${a.sub||''}</div></div>`;
  } else if (a.tipo === 'ia'){          // "IA" com glitch (canais de cor separados, faixas), para o final ruim
    const r = rnd(Math.floor(t*24)+11), g = (r()-.5)*28, on = r() > 0.25;
    const fx = `font-family:Anton,sans-serif;font-size:${a.tam||300}px;letter-spacing:12px;position:absolute;left:0;top:0`;
    h += `<div class="el" style="left:50%;top:${a.y||300}px;transform:translateX(-50%) scale(${0.9+0.1*ease(t/0.2)});opacity:${Math.min(1,t/0.05)*out}">
          <div style="${fx};color:#00e5ff;transform:translate(${on?g:0}px,0);mix-blend-mode:screen">${a.texto||'IA'}</div>
          <div style="${fx};color:#ff1744;transform:translate(${on?-g:0}px,${on?g/3:0}px);mix-blend-mode:screen">${a.texto||'IA'}</div>
          <div style="font-family:Anton,sans-serif;font-size:${a.tam||300}px;letter-spacing:12px;color:#fff;position:relative">${a.texto||'IA'}</div>
          ${a.sub?`<div style="font:800 46px Inter,sans-serif;color:#fff;text-align:center;text-shadow:0 3px 12px #000">${a.sub}</div>`:''}</div>
          <div style="position:absolute;inset:0;opacity:${0.25*out};background:repeating-linear-gradient(0deg,rgba(0,0,0,.6) 0 3px,transparent 3px 7px)"></div>`;
  } else if (a.tipo === 'polaroid'){    // foto (arquivo local em a.src, caminho file://) entrando girando, com legenda
    const p = back(t/0.35);
    h += `<div class="el" style="left:${a.x||1300}px;top:${a.y||140}px;transform:translateY(${(1-p)*400}px) rotate(${(a.rot||6)*(2-p)}deg);opacity:${Math.min(1,t/0.1)*out};
          background:#f6f3ea;padding:18px 18px 70px;box-shadow:0 18px 40px rgba(0,0,0,.6)">
          <img src="${a.src}" style="display:block;width:${a.w||460}px;height:${a.h||460}px;object-fit:cover">
          <div style="position:absolute;left:0;right:0;bottom:12px;text-align:center;font:700 44px Caveat,cursive;color:#222">${a.legenda||''}</div></div>`;
  } else if (a.tipo === 'dinheiro'){    // valor grande verde subindo + rotulo (ex.: US$ 750 mil -> 500 mi)
    const p = ease(t/(a.tc||0.8)); const v = a.de + (a.ate - a.de)*p;
    const s = 1 + 0.14*Math.max(0, 1 - Math.abs(t - (a.tc||0.8))/0.12);
    const txt = (a.fmt||'US$ {v}').replace('{v}', v >= 100 ? Math.round(v) : v.toFixed(a.dec||0));
    h += `<div class="el" style="left:${a.x||960}px;top:${a.y||420}px;transform:translate(-50%,-50%) scale(${s});opacity:${Math.min(1,t/0.1)*out};text-align:center">
          <div style="font-family:Anton,sans-serif;font-size:${a.tam||170}px;color:${a.cor||'#2bd96b'};-webkit-text-stroke:7px #000;paint-order:stroke fill">${txt}</div>
          <div style="font:900 46px Inter,sans-serif;color:#fff;text-shadow:0 3px 12px #000;text-transform:uppercase">${a.rotulo||''}</div></div>`;
  }
  palco.innerHTML = h;
  dentroDaTela();
};

// Mantem toda arte inteira dentro da area segura (margem de 50 px): mede a largura FINAL (sem a animacao de escala,
// offsetWidth ignora transform) e empurra para dentro; se for maior que a tela, diminui.
function dentroDaTela(){
  const M = 50, W = 1920;
  for (const el of palco.children){
    if (!el.classList || !el.classList.contains('el')) continue;
    el.style.width = 'max-content';      // largura natural (senao a caixa estica/encolhe conforme o espaco ate a borda)
    const w = el.offsetWidth; if (!w) continue;
    const tf = el.style.transform || '';
    // deslocamento horizontal em % da propria largura (translate(-50%..), translateX(-110%), calc(-50% + ..))
    const mt = tf.match(/translate(?:X)?\(\s*(?:calc\()?\s*(-?[\d.]+)%/);
    const frac = mt ? parseFloat(mt[1]) / 100 : 0;
    let left;
    if (el.style.left.endsWith('%')) left = W * parseFloat(el.style.left) / 100;
    else if (el.style.left) left = parseFloat(el.style.left);
    else if (el.style.right) left = W - parseFloat(el.style.right) - w;
    else continue;
    let L = left + frac * w, R = L + w;
    if (w > W - 2*M){ el.style.zoom = ((W - 2*M) / w).toFixed(3); continue; }
    let dx = 0;
    if (R > W - M) dx = (W - M) - R;
    if (L + dx < M) dx = M - L;
    if (dx) el.style.marginLeft = dx + 'px';
  }
}
</script></body></html>
